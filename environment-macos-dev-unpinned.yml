name: proteus-dev-macos
channels:
  - conda-forge
  - nodefaults
dependencies:
  - pip
  - compilers
  - make
  - setuptools
  - cython =3.0.11
  - hdf5=*=*mpich*
  - h5py=*=*mpich*
  - metis
  - mpich
  - mpich-mpicc
  - mpich-mpicxx
  - numpy
  - openblas
  - parmetis
  - petsc4py
  # =real_* pins the scalar type; see environment-openmpi-dev.yml for why.
  - petsc =*=real_*
  - scorec
  - superlu
  - superlu_dist
  - triangle
  - pychrono
  - gmsh
  - matplotlib
  - mpi4py
  - pytest
  - pytest-cov
  - pytest-xdist
  - pytest-forked
  - scipy
  - tetgen
  - ncurses
  - python =3.12
  - xtensor-python
  - git-lfs
  - eigen
  - zoltan
  - hypre
  - mumps-mpi
  - scalapack
  - tbb
