name: sdist build + install

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full test suite (PUMI mesh-adaptation + Chrono FSI included).
          # conda-forge ships the scorec package (PUMI) on linux-64, osx-64,
          # linux-aarch64 and osx-arm64 -- but only with mpich builds on
          # osx-arm64, so that leg must use the mpich environment file.
          - name: linux-64 / py3.11
            os: ubuntu-latest
            python: "3.11"
            skip_pumi_chrono: false
            env_file: environment-openmpi-dev.yml
          - name: linux-64 / py3.12
            os: ubuntu-latest
            python: "3.12.5"
            skip_pumi_chrono: false
            env_file: environment-openmpi-dev.yml
          - name: linux-64 / py3.13
            os: ubuntu-latest
            python: "3.13"
            skip_pumi_chrono: false
            env_file: environment-openmpi-dev.yml
          - name: macos-13 (Intel) / py3.12
            os: macos-13
            python: "3.12.5"
            skip_pumi_chrono: false
            env_file: environment-openmpi-dev.yml
          # These two legs still drop scorec+pychrono and skip the PUMI/Chrono
          # extensions (PROTEUS_SKIP_PUMI_CHRONO), but no longer because scorec is
          # missing -- it now builds on both. pychrono is the blocker: on osx-arm64
          # `import pychrono` raises a SWIG overload error on chrono::ChVector3, and
          # importing it after proteus's own C extensions crashes the interpreter
          # outright, taking whole-suite collection with it. Re-enabling PUMI alone
          # on these legs is worth doing once that is sorted out.
          - name: linux-aarch64 / py3.12 (no PUMI/Chrono)
            os: ubuntu-24.04-arm
            python: "3.12.5"
            skip_pumi_chrono: true
            env_file: environment-openmpi-dev.yml
          - name: macos-14 (Apple Silicon) / py3.12 (no PUMI/Chrono)
            os: macos-14
            python: "3.12.5"
            skip_pumi_chrono: true
            env_file: environment-mpich-dev.yml
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build environment file for this leg
        shell: bash
        run: |
          cp "${{ matrix.env_file }}" environment-ci.yml
          # the openmpi/mpich files declare different env names; normalize so
          # activate-environment below matches whichever one this leg copied
          sed -i.bak "s/^name: .*/name: proteus-dev/" environment-ci.yml
          sed -i.bak "s/^  - python =.*/  - python =${{ matrix.python }}/" environment-ci.yml
          if [ "${{ matrix.skip_pumi_chrono }}" = "true" ]; then
            grep -Ev '^ *- *(scorec|pychrono) *[=<>]' environment-ci.yml > environment-ci.yml.tmp
            mv environment-ci.yml.tmp environment-ci.yml
          fi
          rm -f environment-ci.yml.bak
          cat environment-ci.yml

      - name: Set up conda environment with PETSc/MPI/HDF5
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment-ci.yml
          activate-environment: proteus-dev

      - name: Build sdist
        shell: bash -l {0}
        run: |
          pip install build
          python -m build --sdist

      - name: Install sdist with default build isolation
        shell: bash -l {0}
        env:
          PROTEUS_SKIP_PUMI_CHRONO: ${{ matrix.skip_pumi_chrono == true && '1' || '' }}
        run: pip install dist/proteus-*.tar.gz

      - name: Smoke test
        shell: bash -l {0}
        run: |
          cd /tmp
          python -c "import proteus; from proteus import Comm; Comm.init(); print(proteus.__file__)"

      - name: Run test suite
        shell: bash -l {0}
        run: |
          export MPLBACKEND="AGG"
          # OpenBLAS's pthread-based threading isn't fork-safe: a child forked
          # by pytest-forked can inherit the parent's BLAS thread-pool state
          # and abort (SIGABRT) the first time it calls into BLAS/LAPACK, even
          # for something as innocuous as numpy.polynomial.legendre.leggauss
          # at module-import time (proteus/Quadrature.py). Seen as
          # "Fatal Python error: Aborted" during test collection on
          # macos-14/osx-arm64. Force single-threaded BLAS instead.
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          mkdir test_output && cd test_output
          # These are known-failing (real numerics/environment issues, not
          # collection errors) and deliberately left unskipped in source so
          # they stay visible for a future fix session -- deselected here
          # only so this workflow's own signal isn't drowned out by known
          # failures. Remove each line as it gets fixed.
          DESELECT_ARGS=(
            --deselect test/cylinder2D/ibm_method/test_cylinder2D_ibm_rans3p.py::Test_ibm::test_ex2
            --deselect test/cylinder2D/ibm_rans2p/test_cylinder2D_ibm_rans2p.py::Test_ibm::test_ex2
            --deselect test/cylinder2D/ibm_rans2p_3D/test_cylinder3D_ibm_rans2p.py::Test_ibm::test_ex2
            --deselect test/FSI/test_FSI.py::TestIBM::test_fallingCylinderIBM_ball
            --deselect test/FSI/test_FSI.py::TestIBM::test_fallingCylinderIBM_sdf
            --deselect test/SWFlow/test_SWFlow.py::TestSWFlow::test_obstacle_flow
            # Regression from 2d71064a ("Immersed FEM with P1/P2, SCIFEM, and PG (#12)"):
            # its new `order > 2` guards in equivalent_polynomials.h changed this case.
            # TO RE-ENABLE: delete this one --deselect line and confirm the test passes,
            # in the same PR that fixes the guard.
            --deselect test/levelset/vortex2D/test_vortex2D.py::TestVortex2D::test_vortex2D_exactHeaviside
            # Iteration-count tolerance rather than a hard failure: asserts
            # L3[0][1] == pytest.approx(10, rel=0.1) and currently gets 14. This
            # assertion was already loosened once (133731a6) when it came in at 11, so
            # the count has drifted again. TO RE-ENABLE: either widen the tolerance at
            # test_nse_RANS2P_step.py:184 to cover the real cross-platform spread, or
            # find why the solver now needs 14 iterations.
            --deselect test/solver_tests/test_nse_RANS2P_step.py::test_step_slip_FullRun
          )
          # PUMI mesh-adaptation and Chrono FSI extensions aren't built on this leg
          # (see PROTEUS_SKIP_PUMI_CHRONO above); ignore the test files that import
          # proteus.MeshAdaptPUMI.MeshAdapt or pychrono/proteus.mbd, since collecting
          # them would fail on import rather than skip cleanly. This list was built
          # by hand against a point-in-time test tree; it silently goes stale as new
          # PUMI/Chrono-dependent test files are added (already caught two waves of
          # that: test/MeshAdaptPUMI/case_run+gauge_compare and test/AddedMass were
          # both added after the list below was first written) -- if a no-PUMI/Chrono
          # leg starts failing on a PUMI- or Chrono-touching test not listed here,
          # that's why, not a real regression.
          IGNORE_ARGS=()
          if [ "${{ matrix.skip_pumi_chrono }}" = "true" ]; then
            IGNORE_ARGS=(
              --ignore=../test/MeshAdaptPUMI/test_gmshCheck.py
              --ignore=../test/MeshAdaptPUMI/test_poiseuilleError.py
              --ignore=../test/MeshAdaptPUMI/test_parallelMeshLoad.py
              --ignore=../test/MeshAdaptPUMI/test_meshLoad.py
              --ignore=../test/MeshAdaptPUMI/Sizefields/cylinder2D_ibm/test_cylinder2D_ibm_rans2p.py
              --ignore=../test/MeshAdaptPUMI/case_run/test_workflowPUMI.py
              --ignore=../test/MeshAdaptPUMI/gauge_compare/dambreak_Colagrossi_2D/test_MeshAdaptRestart.py
              --ignore=../test/MeshAdaptPUMI/gauge_compare/dambreak_Colagrossi_2D_rd/test_MeshAdaptRestart_withRedistancing.py
              --ignore=../test/MeshAdaptPUMI/gauge_compare/dambreak_Colagrossi_2D_rdmc/test_MeshAdaptRestart_withRDMC.py
              --ignore=../test/FSI/test_FSI.py
              --ignore=../test/test_mbd_chrono.py
              --ignore=../test/AddedMass/test_addedmass2D.py
              --ignore=../test/AddedMass/test_addedmass3D.py
              --deselect ../test/TwoPhaseFlow/test_TwoPhaseFlow.py::TestTwoPhaseFlow::test_damBreak_runPUMI
            )
          fi
          python -m pytest -v --forked --import-mode=importlib \
            "${DESELECT_ARGS[@]}" "${IGNORE_ARGS[@]}" ../test
