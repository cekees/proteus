# OpenMPI-based proteus-dev environment (default/recommended on Linux aarch64
# and x86_64). Full-functionality dev install: scorec/PUMI (mesh adaptation),
# zoltan, and pychrono (multibody/FSI) all included. See environment-mpich-dev.yml
# for the mpich-based alternative and README.md for platform notes on choosing
# between them.
name: proteus-dev-openmpi
channels:
  - conda-forge
  - nodefaults
dependencies:
  - pip =24.0
  - compilers
  - make =4.4.1
  - setuptools =73.0.1
  - cython =3.0.11
  - hdf5 =1.14.6=*openmpi*
  - h5py =3.16.0=*openmpi*
  - metis =5.1.0
  - openmpi =5.0.10
  - numpy =2.5.2
  - openblas =0.3.34
  - parmetis =4.0.3
  - petsc4py =3.25.4
  - petsc =3.25.4
  - scorec >=4.2.1
  - superlu
  - superlu_dist =9.2.1
  - triangle =1.6
  - pychrono >=10.0.0
  - gmsh =4.12.2
  - matplotlib =3.9.2
  - mpi4py =4.1.2
  - pytest =9.1.1
  - pytest-cov =5.0.0
  - pytest-xdist =3.6.1
  - pytest-forked =1.7.5
  - scipy =1.18.0
  - tetgen =1.6.0
  - ncurses =6.6
  - python =3.13.15
  - xtensor-python =0.29.0
  - eigen =5.0.1
  - zoltan
  - hypre =3.1.0
  - mumps-mpi =5.8.2
  - scalapack =2.2.0
  - tbb =2021.13.0
  - zipp =3.20.1
  - parso =0.8.4
  - pycparser =2.22
  - cffi =1.17.1
  - sympy =1.13.2
